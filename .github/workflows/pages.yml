name: Deploy to GitHub Pages

# 只發布網站需要的檔案（白名單），README、設定檔等其他內容不會出現在網站上。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Playwright 1.55 尚未支援 ubuntu-latest 目前解析到的 Ubuntu 26.04。
    # 固定 runner，避免 GitHub 更新 latest 後讓瀏覽器測試突然失效。
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: 檢查 JSON 格式
        run: |
          python3 -m py_compile scripts/validate_data.py scripts/build_site_data.py scripts/check_site_data.py scripts/check_browser_contract.py
          python3 scripts/validate_data.py
          python3 scripts/check_browser_contract.py
          for file in assets/js/modules/*.js assets/js/load-data.js assets/js/app.js; do
            node --check "$file"
          done

      - name: 複製要發布的檔案
        run: |
          mkdir _site
          cp -r index.html 404.html favicon.svg robots.txt sitemap.xml assets _site/
          mkdir -p _site/data
          cp data/pattern-meta.json _site/data/
          python3 scripts/build_site_data.py --source data/cases.json --output _site/data
          python3 scripts/check_site_data.py _site/data

      - name: 瀏覽器冒煙測試
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          node tests/browser-smoke.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
